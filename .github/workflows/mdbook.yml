name: Deploy mdBook

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # mdBook with `$...$` math syntax: rust-lang/mdBook#2968
  MDBOOK_REPO: https://github.com/jeanas/mdBook
  MDBOOK_REV: f6bbe0dd48816812135dc5d5ab6bb7e90731ce00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore mdBook
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ env.MDBOOK_REV }}

      - name: Setup mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install --git "$MDBOOK_REPO" --rev "$MDBOOK_REV" --locked mdbook

      - name: Build
        run: mdbook build

      - name: Verify math rendered
        run: |
          grep -rq 'class="math math-' book/html/ \
            || { echo "::error::no math spans"; exit 1; }
          grep -rqi 'mathjax' book/html/ \
            || { echo "::error::MathJax not loaded"; exit 1; }

      - name: Copy CNAME
        run: cp CNAME book/html/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./book/html

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
